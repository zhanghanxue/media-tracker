#:schema node_modules/wrangler/config-schema.json
name = "media-tracker"
main = "src/worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Production routing — bind the Worker to media.zhanghanxue.com.
# `custom_domain = true` causes Wrangler to auto-create the DNS record at
# deploy time, so no manual A/AAAA record is needed.
[[routes]]
pattern = "media.zhanghanxue.com"
custom_domain = true

# D1 database (created via `wrangler d1 create media-tracker-db`, region WEUR).
# Schema lands in Phase 2 via `migrations/0001_create_media.sql`.
[[d1_databases]]
binding = "DB"
database_name = "media-tracker-db"
database_id = "27c13a59-202f-4f56-a460-147aa79d20a0"

# R2 bucket for cover images. Uploads land in Phase 4.
[[r2_buckets]]
binding = "COVERS"
bucket_name = "media-tracker-covers"
